[project]
name = "hw-review"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic",
    "python-multipart",
    "xlrd",
    "openpyxl>=3.1,<4",
    "xlutils>=2,<3",
    "olefile",
    "pymupdf",
    "pywin32",
    "psutil",
]

[project.optional-dependencies]
test = ["pytest", "xlwt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Managed Windows hosts can carry a broken ACL on the default
# %TEMP%\pytest-of-<user> directory, which makes every tmp_path-based test
# error out with PermissionError. Keeping pytest's base temp inside the
# repository sidesteps that host-specific temp root. `.tmp/` is git-ignored.
addopts = "--basetemp=.tmp/pytest"
