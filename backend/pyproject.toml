[project]
name = "hw-review"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
    "xlrd>=2.0,<3",
    "openpyxl>=3.1,<4",
    "xlutils>=2,<3",
    "olefile>=0.47,<1",
    "pymupdf>=1.24,<2",
    "pywin32>=306,<400",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "xlwt>=1.3,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Managed Windows hosts can carry a broken ACL on the default
# %TEMP%\pytest-of-<user> directory, which makes every tmp_path-based test
# error out with PermissionError. Keeping pytest's base temp inside the
# repository sidesteps that host-specific temp root. `.tmp/` is git-ignored.
addopts = "--basetemp=.tmp/pytest"
